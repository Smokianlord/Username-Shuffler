name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Standalone Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow darkdetect

      - name: Build Executable & Package Release ZIP
        run: |
          python build.py

      - name: Generate Checksums
        shell: pwsh
        run: |
          $zipPath = Get-ChildItem -Path dist -Filter "*-Windows.zip" | Select-Object -First 1 -ExpandProperty FullName
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          $hashFile = "$zipPath.sha256"
          "$hash  $([System.IO.Path]::GetFileName($zipPath))" | Out-File -Encoding ascii $hashFile
          Write-Host "SHA256: $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Username Shuffler ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/*-Windows.zip
            dist/*.sha256
            dist/Username-Shuffler.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
